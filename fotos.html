<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Especial ❤️</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            margin: 0;
            padding: 0;
            /* Mantenemos el fondo rosado de tu proyecto */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Contenedor del video ocupando gran parte de la pantalla */
        .video-container {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botón de volver pequeño y elegante */
        .btn-volver {
            background: #e84393;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        .btn-volver:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- Video configurado para autoplay y silencio (obligatorio para que funcione solo) -->
<div class="video-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; border-radius: 20px;">
    <p style="color: white; margin-bottom: 20px; text-align: center; padding: 20px;">
        Haz clic en el botón para ver nuestro video especial:
    </p>
    <a href="https://youtu.be/F_zwl7nCzdY" target="_blank" style="background: #e84393; color: white; padding: 20px 40px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 18px; box-shadow: 0 5px 15px rgba(232, 67, 147, 0.4);">
        ▶️ VER VIDEO
    </a>
</div>

    <a href="index.html" class="btn-volver">⬅ Volver al Inicio</a>

</body>
</html>
